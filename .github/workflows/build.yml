name: Build DotMan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools libfuse2

      - name: Install npm dependencies
        run: npm install

      - name: Build React frontend
        run: npx tsc && npx vite build

      - name: Build Electron main process
        run: npx tsc --project tsconfig.electron.json

      - name: Package Linux builds
        run: npx electron-builder --linux deb AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Continuous Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Xóa bản release 'latest' cũ nếu có
          gh release delete latest --cleanup-tag -y || true
          
          # Gom file hợp lệ để upload
          FILES=""
          for f in dist-build/*.deb dist-build/*.AppImage; do
            if [ -f "$f" ]; then
              FILES="$FILES $f"
            fi
          done
          
          if [ -n "$FILES" ]; then
            gh release create latest $FILES --title "DotMan Latest Build" --notes "Bản build tự động từ nhánh main."
          else
            echo "Error: Không tìm thấy file cài đặt nào trong thư mục dist-build/"
            exit 1
          fi
