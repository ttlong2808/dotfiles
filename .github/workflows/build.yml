name: Build DotMan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install npm dependencies
        run: npm install

      - name: Build React frontend
        run: npx tsc && npx vite build

      - name: Build Electron main process
        run: npx tsc --project tsconfig.electron.json

      - name: Package Linux builds
        run: npx electron-builder --linux deb AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        if: always()
        run: ls -la dist-build/ || echo "No dist-build directory found"

      - name: Upload DEB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DotMan-deb
          path: dist-build/*.deb
          if-no-files-found: warn

      - name: Upload AppImage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DotMan-AppImage
          path: dist-build/*.AppImage
          if-no-files-found: warn
