# Hyprland Main Configuration File
# Split into modular parts for better management

# 1. Environment Variables
env = XCURSOR_SIZE,24

# 2. Source Modular Configurations
source = ~/.config/hypr/conf/general.conf
source = ~/.config/hypr/conf/keybindings.conf

# 3. Source User Custom Overrides (Ignored by Git)
# This allows users to have their own settings without branch conflicts
source = ~/.config/hypr/custom/general.conf
source = ~/.config/hypr/custom/keybindings.conf

# 4. Window Rules
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(blueman-manager)$
